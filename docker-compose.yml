# Pwned Passwords service (https://haveibeenpwned.com/Passwords)

#-# Define the network
networks:
  pwned-network:

#-# Define services
services:
  pwned-passwords:
    image: pwned-httpd:latest
    volumes:
      - "$PWD:/data:ro,z"
    networks:
      pwned-network:
    restart: on-failure
    ports:
      - "2080:8080"
